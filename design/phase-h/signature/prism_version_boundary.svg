<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Quarter Prism metric-version boundary state</title><desc id="d">A double calibration seam interrupts Lineage W and restarts the baseline for royalty-integrated v2.</desc><rect width="1000" height="600" fill="#F3F0E7"/><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#192321}.s{font-size:13px;fill:#4B5753}.a{stroke:#1F6763;fill:none;stroke-width:3}.b{stroke:#192321;fill:none;stroke-width:3;stroke-dasharray:9 5}</style>
<text x="45" y="45" class="s">QUARTER PRISM / VERSION BOUNDARY</text><text x="45" y="82" font-size="26" font-weight="650">Lineage W · calibration seam</text><line x1="45" y1="110" x2="955" y2="110" stroke="#969B92"/>
<path d="M80 320L220 290L360 335L455 300" class="a"/><path d="M545 250L680 290L815 325L930 360" class="b"/>
<line x1="492" y1="150" x2="492" y2="450" stroke="#192321" stroke-width="4"/><line x1="504" y1="150" x2="504" y2="450" stroke="#192321"/><text x="520" y="180" font-size="16" font-weight="650">Reporting definition changed</text><text x="520" y="207" class="s">legacy_v1 → royalty-integrated_v2</text><text x="520" y="235" class="s">cross-version change allowed: false</text>
<text x="95" y="410" class="s">legacy lane ends</text><text x="560" y="410" class="s">v2 baseline restarts at 100</text><text x="560" y="438" class="s">first v2 QoQ unavailable</text>
<line x1="45" y1="490" x2="955" y2="490" stroke="#969B92"/><text x="45" y="530" class="s">The seam is neutral calibration, not an error state.</text></svg>
