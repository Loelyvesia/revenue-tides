<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Quarter Prism metric-version overlap state</title><desc id="d">Lineage M 2025Q2 displays simultaneous legacy and royalty-integrated values in separate lanes.</desc><rect width="1000" height="600" fill="#F3F0E7"/><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#192321}.s{font-size:13px;fill:#4B5753}.lane{fill:#FBF9F2;stroke:#C9C7BC}</style>
<text x="45" y="45" class="s">QUARTER PRISM / VERSION OVERLAP</text><text x="45" y="82" font-size="26" font-weight="650">Lineage M · 2025Q2</text><line x1="45" y1="110" x2="955" y2="110" stroke="#969B92"/>
<rect x="115" y="155" width="770" height="135" class="lane"/><text x="145" y="190" class="s">legacy_v1</text><line x1="270" y1="235" x2="690" y2="235" stroke="#1F6763" stroke-width="5"/><circle cx="690" cy="235" r="9" fill="#1F6763"/><text x="725" y="242" font-size="19">KRW 120,180m</text>
<rect x="115" y="315" width="770" height="135" class="lane"/><text x="145" y="350" class="s">royalty-integrated_v2</text><line x1="270" y1="395" x2="745" y2="395" stroke="#192321" stroke-width="3" stroke-dasharray="9 5"/><circle cx="745" cy="395" r="9" fill="#F3F0E7" stroke="#192321" stroke-width="3"/><text x="775" y="402" font-size="19">KRW 133,635m</text>
<line x1="95" y1="140" x2="95" y2="470" stroke="#192321" stroke-width="4"/><line x1="104" y1="140" x2="104" y2="470" stroke="#192321"/><text x="115" y="500" font-size="15" font-weight="650">Same quarter · two definitions · no growth interpretation</text><text x="115" y="530" class="s">Both values remain visible. No before/after arrow. No cross-version QoQ.</text></svg>
