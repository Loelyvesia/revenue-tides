<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Measurement primer wireframe</title><desc id="d">Five ledger rows introduce entity, evidence, metric version, scope, and uncertainty.</desc>
  <rect width="1200" height="760" fill="#F3F0E7"/><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#192321}.s{font-size:14px;fill:#4B5753}.rule{stroke:#969B92}.grid{stroke:#C9C7BC}.teal{stroke:#1F6763;fill:#1F6763}.violet{stroke:#655B75;fill:none;stroke-width:2}</style>
  <text x="70" y="68" class="s">01 / MEASUREMENT PRIMER</text><text x="70" y="125" font-size="38" font-weight="650">一个收入数字由什么构成？</text>
  <line x1="70" y1="155" x2="1130" y2="155" class="rule"/>
  <g font-size="18"><text x="80" y="215">01 实体</text><text x="330" y="215">GAME_TITLE  ≠  IP</text><text x="790" y="215" class="s">先确认被报告的对象</text>
  <text x="80" y="305">02 证据</text><circle cx="350" cy="298" r="8" class="teal"/><text x="375" y="305">Official reported</text><path d="M590 290 l9 8 -9 8 -9-8z" class="violet"/><text x="615" y="305">Derived from official</text>
  <text x="80" y="395">03 口径版本</text><line x1="340" y1="366" x2="340" y2="410" stroke="#192321" stroke-width="3"/><line x1="350" y1="366" x2="350" y2="410" stroke="#192321" stroke-width="1"/><text x="375" y="395">版本变化不是商业增长</text>
  <text x="80" y="485">04 范围</text><text x="330" y="485">平台 / 地区 / 会计口径</text><text x="790" y="485" class="s">数字旁必须保留范围</text>
  <text x="80" y="575">05 不确定性</text><line x1="340" y1="568" x2="545" y2="568" stroke="#59615E" stroke-width="3"/><line x1="340" y1="555" x2="340" y2="581" stroke="#59615E"/><line x1="545" y1="555" x2="545" y2="581" stroke="#59615E"/><path d="M438 559 l9 9 -9 9 -9-9z" class="violet"/><text x="590" y="575">点估计 + 兼容区间</text></g>
  <g class="grid"><line x1="70" y1="245" x2="1130" y2="245"/><line x1="70" y1="335" x2="1130" y2="335"/><line x1="70" y1="425" x2="1130" y2="425"/><line x1="70" y1="515" x2="1130" y2="515"/><line x1="70" y1="605" x2="1130" y2="605"/></g>
  <text x="70" y="680" class="s">Next: move one fiscal quarter through the Quarter Prism →</text>
</svg>
